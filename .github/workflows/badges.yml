name: CI badges

on:
  push:
    branches: [main, codex/multipart-ci-badge]
    paths:
      - '.github/scripts/ci_badges.py'
      - '.github/workflows/badges.yml'
  workflow_run:
    workflows: [native, Documentation, coverage, Docker, Nix]
    branches: [main]
    types: [requested, in_progress, completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ci-badge-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ekmett/native'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read current main workflow results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_badges.py --output build/badges
      - name: Publish endpoint JSON
        # The data-only badges branch is seeded before this workflow's first run.
        # workflow_run starts refreshing automatically once this file is on main.
        run: |
          git fetch origin badges
          git worktree add --detach build/badge-publish FETCH_HEAD
          mkdir -p build/badge-publish/assets/badges
          cp build/badges/*.json build/badge-publish/assets/badges/
          cd build/badge-publish
          git add assets/badges/*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update CI badge colors'
          git push origin HEAD:refs/heads/badges
