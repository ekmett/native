name: C++26 modules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} / exceptions=${{ matrix.exceptions }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        exceptions: ['ON', 'OFF']
        platform:
          - name: Linux LLVM 23 / AVX2
            runner: ubuntu-24.04
            profile: AVX2
            profiles: AVX2;AVX512
          - name: Windows x64 LLVM 23 / AVX2
            runner: windows-2025
            profile: AVX2
            profiles: AVX2;AVX512
          - name: Windows ARM64 LLVM 23 / NEON
            runner: windows-11-arm
            profile: NEON
            profiles: NEON
          - name: Linux ARM64 LLVM 23 / NEON
            runner: ubuntu-24.04-arm
            profile: NEON
            profiles: NEON
          - name: macOS LLVM 23 / NEON
            runner: macos-15
            profile: NEON
            profiles: NEON
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "${BASE_SHA}^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - uses: ./.github/actions/setup/ubuntu/compiler
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/ubuntu/build-tools
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/macos/compiler
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/macos/build-tools
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/windows
        if: runner.os == 'Windows'
      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Record Windows hardware and admit the test architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_PROFILE: ${{ matrix.platform.profile }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & {
            git rev-parse HEAD
            Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, Architecture, NumberOfCores
            Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, OSArchitecture
            clang-cl --version
            clang-scan-deps --version
            cmake --version
            ninja --version
            "AVX2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported)"
            "FMA=$([System.Runtime.Intrinsics.X86.Fma]::IsSupported)"
            "BMI2=$([System.Runtime.Intrinsics.X86.Bmi2]::IsSupported)"
            "NEON=$([System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported)"
          } | Tee-Object build/environment.log
          if ($env:TEST_PROFILE -eq 'AVX2') {
            if ($env:RUNNER_ARCH -ne 'X64' -or
                -not [System.Runtime.Intrinsics.X86.Avx2]::IsSupported -or
                -not [System.Runtime.Intrinsics.X86.Fma]::IsSupported -or
                -not [System.Runtime.Intrinsics.X86.Bmi2]::IsSupported) {
              throw 'AVX2 tests require native x64 with AVX2, FMA and BMI2.'
            }
          } elseif ($env:RUNNER_ARCH -ne 'ARM64' -or
                    -not [System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported) {
            throw 'NEON tests require native ARM64 with Advanced SIMD.'
          }
          "Native Windows CPU tests: $env:RUNNER_ARCH / $env:TEST_PROFILE. AVX-512 execution depends on the test's CPU and OS checks." >> $env:GITHUB_STEP_SUMMARY
      - name: Record hardware and admit the test architecture
        if: runner.os != 'Windows'
        shell: bash
        env:
          TEST_PROFILE: ${{ matrix.platform.profile }}
        run: |
          mkdir -p build
          {
            git rev-parse HEAD
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then
              lscpu
              cat /proc/cpuinfo
            else
              sysctl hw.model hw.machine hw.ncpu
              sysctl -a | grep -E '^machdep.cpu.|^hw.optional.' || true
            fi
            clang++ --version
            clang-scan-deps --version
            cmake --version
            ninja --version
          } | tee build/environment.log
          if [[ "$TEST_PROFILE" == NEON ]]; then
            case "$(uname -m)" in
              arm64|aarch64) ;;
              *) echo '::error::NEON tests require a native ARM64 runner.'; exit 1 ;;
            esac
          else
            [[ "$(uname -m)" == x86_64 ]] || {
              echo '::error::AVX2 tests require a native x86-64 runner.'; exit 1;
            }
            if [[ "$RUNNER_OS" == Linux ]]; then
              flags=$(cat /proc/cpuinfo)
            else
              flags=$(sysctl -n machdep.cpu.features machdep.cpu.leaf7_features)
            fi
            for feature in avx2 fma bmi2; do
              grep -qiw "$feature" <<< "$flags" || {
                echo "::error::This test profile requires $feature on the runner."
                exit 1
              }
            done
          fi
          echo "Native CPU package tests: $RUNNER_OS / $(uname -m) / $TEST_PROFILE. AVX-512 compilation is not proof of AVX-512 execution; profile tests report unsupported hardware as skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Check compiler cache launcher
        if: runner.os != 'Windows'
        run: |
          python3 -B .github/scripts/test_sccache_launcher.py
          python3 -B .github/scripts/test_sccache_pch.py "$(command -v clang++)" "$GITHUB_WORKSPACE/build/sccache-pch-probe"
      - name: Configure modules
        shell: bash
        run: |
          compiler=clang++
          launcher=sccache
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=clang-cl
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          else
            launcher="$(command -v python3);$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"
          fi
          if [[ "${RUNNER_OS}" == Linux ]]; then
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          fi
          cmake -S . -B build/core -G Ninja \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" \
            -DSIMD_BUILD_TESTS=ON -DSIMD_ENABLE_EXCEPTIONS=${{ matrix.exceptions }} -DSIMD_ENABLE_PCH=ON -DSIMD_ENABLE_IPO=ON \
            -DSIMD_TEST_ISA="${{ matrix.platform.profile }}" \
            '-DSIMD_PROFILES=${{ matrix.platform.profiles }}' "${extra[@]}"
      - name: Build
        run: cmake --build build/core --parallel 2
      - name: Test
        shell: bash
        run: |
          ctest --test-dir build/core --show-only=json-v1 > build/tests.json
          ctest --test-dir build/core --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/tests.xml"
      - name: Retain native NEON compaction observations
        if: matrix.platform.profile == 'NEON'
        shell: bash
        run: |
          executable=build/core/tests/compaction/simd_compaction_neon_import
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          "$executable" --bench | tee build/compaction-neon-benchmark.log
          object=$(find build/core/tests/compaction -type f -path '*simd_compaction_neon_import_body.dir*' \( -name main.cc.o -o -name main.cc.obj \) -print -quit)
          test -n "$object"
          llvm-objdump -d --disassemble-symbols=compaction_codegen,expansion_codegen,compaction_store_codegen,_compaction_codegen,_expansion_codegen,_compaction_store_codegen "$object" > build/compaction-neon-codegen.log
          echo 'NEON compaction observations compare interleaved native and reference kernels on this hosted runner; these are not stable performance guarantees.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build/core --prefix build/install
      - name: Test relocated package boundaries and modules
        shell: bash
        run: |
          cmake -E rename build/install 'build/relocated package'
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then compiler=clang-cl; fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          suites=(public_headers omnibus api)
          if [[ "${{ matrix.platform.profile }}" != NEON ]]; then
            suites+=(cpuid_package profile_package)
          fi
          for suite in "${suites[@]}"; do
            cmake -S "tests/$suite" -B "build/$suite" -G Ninja \
              -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -Dsimd_DIR="$GITHUB_WORKSPACE/build/relocated package/lib/cmake/simd" \
              -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF \
              "${extra[@]}"
            cmake --build "build/$suite" --parallel 2
            ctest --test-dir "build/$suite" --no-tests=error --output-on-failure \
              --output-junit "$GITHUB_WORKSPACE/build/$suite-tests.xml"
          done
      - name: Compile and test opt-in BF16 package (clang-cl)
        if: runner.os == 'Windows' && matrix.platform.profile == 'AVX2'
        shell: pwsh
        env:
          BF16_EXCEPTIONS: ${{ matrix.exceptions }}
        run: |
          cmake -S . -B build/bf16-ci -G Ninja `
            -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release -DCMAKE_LINKER_TYPE=LLD `
            -DSIMD_BUILD_TESTS=ON -DSIMD_ENABLE_PCH=ON -DSIMD_ENABLE_IPO=ON `
            "-DSIMD_ENABLE_EXCEPTIONS=$env:BF16_EXCEPTIONS" `
            '-DSIMD_PROFILES=AVX2;AVX512;AVX512_BF16'
          if ($LASTEXITCODE) { throw 'BF16 configuration failed.' }
          cmake --build build/bf16-ci --target simd simd_test_admission simd_test_bf16 --parallel 2
          if ($LASTEXITCODE) { throw 'BF16 compilation failed.' }
          ctest --test-dir build/bf16-ci -R '^simd[.](cpuid[.]admission|bf16[.])' `
            --no-tests=error --output-on-failure -j1 --output-junit "$env:GITHUB_WORKSPACE/build/bf16-tests.xml"
          if ($LASTEXITCODE) { throw 'BF16 tests failed.' }
          cmake --install build/bf16-ci --prefix build/bf16-install
          if ($LASTEXITCODE) { throw 'BF16 installation failed.' }
          cmake -E rename build/bf16-install 'build/bf16 relocated package'
          if ($LASTEXITCODE) { throw 'BF16 relocation failed.' }
          cmake -S tests/bf16_profile -B build/bf16-package -G Ninja `
            -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release -DCMAKE_LINKER_TYPE=LLD `
            "-Dsimd_DIR=$env:GITHUB_WORKSPACE/build/bf16 relocated package/lib/cmake/simd" `
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
          if ($LASTEXITCODE) { throw 'BF16 consumer configuration failed.' }
          cmake --build build/bf16-package --parallel 2
          if ($LASTEXITCODE) { throw 'BF16 consumer compilation failed.' }
          ctest --test-dir build/bf16-package --no-tests=error --output-on-failure -j1 `
            --output-junit "$env:GITHUB_WORKSPACE/build/bf16-package-tests.xml"
          if ($LASTEXITCODE) { throw 'BF16 consumer tests failed.' }
          'Opt-in BF16 storage and dot2 compiled and packaged; native execution requires the complete CPUID/XCR0 admission test (skip 77 otherwise).' >> $env:GITHUB_STEP_SUMMARY
      - name: Compile and test opt-in BF16 package (clang++)
        if: runner.os == 'Linux' && matrix.platform.profile == 'AVX2'
        shell: bash
        env:
          BF16_EXCEPTIONS: ${{ matrix.exceptions }}
        run: |
          cmake -S . -B build/bf16-ci -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_LINKER_TYPE=LLD \
            -DSIMD_BUILD_TESTS=ON -DSIMD_ENABLE_PCH=ON -DSIMD_ENABLE_IPO=ON \
            -DSIMD_ENABLE_EXCEPTIONS="$BF16_EXCEPTIONS" \
            '-DSIMD_PROFILES=AVX2;AVX512;AVX512_BF16'
          cmake --build build/bf16-ci --target simd simd_test_admission simd_test_bf16 --parallel 2
          ctest --test-dir build/bf16-ci -R '^simd[.](cpuid[.]admission|bf16[.])' \
            --no-tests=error --output-on-failure -j1 --output-junit "$GITHUB_WORKSPACE/build/bf16-tests.xml"
          cmake --install build/bf16-ci --prefix build/bf16-install
          cmake -E rename build/bf16-install 'build/bf16 relocated package'
          cmake -S tests/bf16_profile -B build/bf16-package -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_LINKER_TYPE=LLD \
            -Dsimd_DIR="$GITHUB_WORKSPACE/build/bf16 relocated package/lib/cmake/simd" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF
          cmake --build build/bf16-package --parallel 2
          ctest --test-dir build/bf16-package --no-tests=error --output-on-failure -j1 \
            --output-junit "$GITHUB_WORKSPACE/build/bf16-package-tests.xml"
          echo 'Opt-in BF16 storage and dot2 compiled and packaged; native execution requires the complete CPUID/XCR0 admission test (skip 77 otherwise).' >> "$GITHUB_STEP_SUMMARY"
      - name: Compile and test opt-in NEON FP16 package
        if: matrix.platform.profile == 'NEON'
        shell: bash
        env:
          FP16_EXCEPTIONS: ${{ matrix.exceptions }}
        run: |
          compiler=clang++
          extra=()
          # Keep FP16 out of the minimum while qualifying stronger source/PCH imports.
          minimum='-march=armv8-a'
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=clang-cl
            minimum='/clang:-march=armv8-a'
          fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          cmake -S . -B build/fp16-ci -G Ninja \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -DSIMD_BUILD_TESTS=ON -DSIMD_ENABLE_IPO=ON \
            -DSIMD_ENABLE_EXCEPTIONS="$FP16_EXCEPTIONS" \
            '-DSIMD_PROFILES=NEON;NEON_FP16' "-DSIMD_MINIMAL_COMPILE_OPTIONS=$minimum" "${extra[@]}"
          cmake --build build/fp16-ci --target simd simd_test_neon_fp16 \
            simd_compaction_neon_fp16_header simd_compaction_neon_fp16_import --parallel 2
          ctest --test-dir build/fp16-ci -R '^simd[.](neon_fp16[.]|compaction[.]neon_fp16[.])' \
            --no-tests=error --output-on-failure -j1 --output-junit "$GITHUB_WORKSPACE/build/fp16-tests.xml"
          cmake --install build/fp16-ci --prefix build/fp16-install
          cmake -E rename build/fp16-install 'build/fp16 relocated package'
          for suite in neon_fp16 omnibus half_storage; do
            cmake -S "tests/$suite" -B "build/fp16-$suite" -G Ninja \
              -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -Dsimd_DIR="$GITHUB_WORKSPACE/build/fp16 relocated package/lib/cmake/simd" \
              -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF "${extra[@]}"
            cmake --build "build/fp16-$suite" --parallel 2
            ctest --test-dir "build/fp16-$suite" --no-tests=error --output-on-failure -j1 \
              --output-junit "$GITHUB_WORKSPACE/build/fp16-$suite-tests.xml"
          done
          echo 'Opt-in FP16 compiled, relocated and tested; native entry requires baseline and scalar/vector FP16 OS admission (skip 77 otherwise).' >> "$GITHUB_STEP_SUMMARY"
      - name: Record compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        shell: bash
        run: |
          mkdir -p build
          sccache --version | tee build/sccache-version.txt
          sccache --show-adv-stats | tee build/sccache-stats.txt
          sccache --show-stats --stats-format=json > build/sccache-stats.json
          {
            echo '### Compiler cache'
            echo '```text'
            cat build/sccache-version.txt build/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain configure, test and cache logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.platform.runner }}-${{ matrix.platform.profile }}-exceptions-${{ matrix.exceptions }}
          if-no-files-found: ignore
          path: |
            build/environment.log
            build/compaction-neon-benchmark.log
            build/compaction-neon-codegen.log
            build/sccache-*
            build/tests.json
            build/tests.xml
            build/*-tests.xml
            build/public_headers/Testing/Temporary/
            build/omnibus/Testing/Temporary/
            build/cpuid_package/Testing/Temporary/
            build/cpuid_package/compile_commands.json
            build/bf16-ci/CMakeCache.txt
            build/bf16-ci/CMakeFiles/CMakeConfigureLog.yaml
            build/bf16-ci/Testing/Temporary/
            build/bf16-package/Testing/Temporary/
            build/bf16-package/compile_commands.json
            build/fp16-ci/CMakeCache.txt
            build/fp16-ci/CMakeFiles/CMakeConfigureLog.yaml
            build/fp16-ci/Testing/Temporary/
            build/fp16-neon_fp16/Testing/Temporary/
            build/fp16-neon_fp16/compile_commands.json
            build/fp16-omnibus/Testing/Temporary/
            build/fp16-half_storage/Testing/Temporary/
            build/core/CMakeCache.txt
            build/core/CMakeFiles/CMakeConfigureLog.yaml
            build/core/Testing/Temporary/
