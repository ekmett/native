name: native

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'etc/cmake/**'
      - 'src/**'
      - 'tests/**'
      - '!src/**/*.md'
      - '!tests/**/*.md'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'etc/cmake/**'
      - 'src/**'
      - 'tests/**'
      - '!src/**/*.md'
      - '!tests/**/*.md'
      - 'README.md'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      coverage:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.coverage && github.run_id || github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.coverage }}

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.platform.name }}${{ matrix.exceptions == 'OFF' && ' (no exceptions)' || '' }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: ${{ (inputs.coverage || github.event_name == 'workflow_dispatch') && 90 || github.event_name == 'schedule' && 45 || 20 }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Main: one smoke runner. PRs add Windows ARM; nightly adds x86.
        # Manual dispatch retains all platforms and both exception modes.
        # The coverage caller uses all platforms with exceptions enabled.
        exceptions: ${{ !inputs.coverage && github.event_name == 'workflow_dispatch' && fromJSON('["ON", "OFF"]') || fromJSON('["ON"]') }}
        platform: >-
          ${{ fromJSON((inputs.coverage || github.event_name == 'workflow_dispatch') &&
          '[{"name":"Linux x64 · AVX2","runner":"ubuntu-24.04","profile":"AVX2","profiles":"AVX2;AVX512;AVX512_BF16;AVX512_FP16"},
            {"name":"Windows x64 · AVX2","runner":"windows-2025","profile":"AVX2","profiles":"AVX2;AVX512;AVX512_BF16;AVX512_FP16"},
            {"name":"Windows ARM64 · NEON","runner":"windows-11-arm","profile":"NEON","profiles":"NEON;NEON_FP16;NEON_BF16"},
            {"name":"Linux ARM64 · NEON","runner":"ubuntu-24.04-arm","profile":"NEON","profiles":"NEON;NEON_FP16;NEON_BF16"},
            {"name":"macOS ARM64 · NEON","runner":"macos-15","profile":"NEON","profiles":"NEON;NEON_FP16;NEON_BF16"}]' || github.event_name == 'schedule' &&
          '[{"name":"Linux x64 · AVX2","runner":"ubuntu-24.04","profile":"AVX2","profiles":"AVX2;AVX512;AVX512_BF16;AVX512_FP16"},
            {"name":"Linux ARM64 · NEON","runner":"ubuntu-24.04-arm","profile":"NEON","profiles":"NEON;NEON_FP16;NEON_BF16"}]' || github.event_name == 'pull_request' &&
          '[{"name":"Windows ARM64 · NEON","runner":"windows-11-arm","profile":"NEON","profiles":"NEON;NEON_FP16;NEON_BF16"},
            {"name":"Linux ARM64 · NEON","runner":"ubuntu-24.04-arm","profile":"NEON","profiles":"NEON;NEON_FP16;NEON_BF16"}]' ||
          '[{"name":"Linux ARM64 · NEON","runner":"ubuntu-24.04-arm","profile":"NEON","profiles":"NEON;NEON_FP16;NEON_BF16"}]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "${BASE_SHA}^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - uses: ./.github/actions/setup/ubuntu/compiler
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/ubuntu/build-tools
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/macos/compiler
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/macos/build-tools
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/windows
        if: runner.os == 'Windows'
      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Record Windows hardware and admit the test architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_PROFILE: ${{ matrix.platform.profile }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & {
            git rev-parse HEAD
            Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, Architecture, NumberOfCores
            Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, OSArchitecture
            clang-cl --version
            clang-scan-deps --version
            cmake --version
            ninja --version
            "AVX2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported)"
            "FMA=$([System.Runtime.Intrinsics.X86.Fma]::IsSupported)"
            "BMI2=$([System.Runtime.Intrinsics.X86.Bmi2]::IsSupported)"
            "NEON=$([System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported)"
          } | Tee-Object build/environment.log
          if ($env:TEST_PROFILE -eq 'AVX2') {
            if ($env:RUNNER_ARCH -ne 'X64' -or
                -not [System.Runtime.Intrinsics.X86.Avx2]::IsSupported -or
                -not [System.Runtime.Intrinsics.X86.Fma]::IsSupported) {
              throw 'AVX2 tests require native x64 with AVX2 and FMA.'
            }
          } elseif ($env:RUNNER_ARCH -ne 'ARM64' -or
                    -not [System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported) {
            throw 'NEON tests require native ARM64 with Advanced SIMD.'
          }
          "Native Windows CPU tests: $env:RUNNER_ARCH / $env:TEST_PROFILE. AVX-512 execution depends on the test's CPU and OS checks." >> $env:GITHUB_STEP_SUMMARY
      - name: Record hardware and admit the test architecture
        if: runner.os != 'Windows'
        shell: bash
        env:
          TEST_PROFILE: ${{ matrix.platform.profile }}
        run: |
          mkdir -p build
          {
            git rev-parse HEAD
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then
              lscpu
              cat /proc/cpuinfo
            else
              sysctl hw.model hw.machine hw.ncpu
              sysctl -a | grep -E '^machdep.cpu.|^hw.optional.' || true
            fi
            clang++ --version
            clang-scan-deps --version
            cmake --version
            ninja --version
          } | tee build/environment.log
          if [[ "$TEST_PROFILE" == NEON ]]; then
            case "$(uname -m)" in
              arm64|aarch64) ;;
              *) echo '::error::NEON tests require a native ARM64 runner.'; exit 1 ;;
            esac
          else
            [[ "$(uname -m)" == x86_64 ]] || {
              echo '::error::AVX2 tests require a native x86-64 runner.'; exit 1;
            }
            if [[ "$RUNNER_OS" == Linux ]]; then
              flags=$(cat /proc/cpuinfo)
            else
              flags=$(sysctl -n machdep.cpu.features machdep.cpu.leaf7_features)
            fi
            for feature in avx2 fma; do
              grep -qiw "$feature" <<< "$flags" || {
                echo "::error::This test profile requires $feature on the runner."
                exit 1
              }
            done
          fi
          echo "Native CPU package tests: $RUNNER_OS / $(uname -m) / $TEST_PROFILE. AVX-512 compilation is not proof of AVX-512 execution; profile tests report unsupported hardware as skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Check compiler cache launcher
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -B .github/scripts/test_sccache_launcher.py
          else
            python3 -B .github/scripts/test_sccache_launcher.py
          fi
      - name: Check PCH cache invalidation
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        run: |
          python3 -B .github/scripts/test_sccache_pch.py "$(command -v clang++)" "$GITHUB_WORKSPACE/build/sccache-pch-probe"
      - name: Check Windows module cache invalidation
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: |
          python -B .github/scripts/test_sccache_modules.py --compiler clang-cl \
            --output build/sccache-modules --cmake-arg=-DCMAKE_LINKER_TYPE=LLD
      - name: Install grcov
        if: inputs.coverage
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python .github/scripts/install_grcov.py
          else
            python3 .github/scripts/install_grcov.py
          fi
      - name: Configure modules
        shell: bash
        run: |
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=clang-cl
            launcher="python;$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          else
            launcher="$(command -v python3);$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"
          fi
          if [[ "${RUNNER_OS}" == Linux ]]; then
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          fi
          if [[ '${{ inputs.coverage }}' == true ]]; then
            extra+=(-DNATIVE_ENABLE_COVERAGE=ON)
          fi
          cmake -S . -B build/core -G Ninja \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" \
            -DNATIVE_BUILD_TESTS=ON -DNATIVE_TEST_EXTENDED=${{ (inputs.coverage || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ON' || 'OFF' }} \
            -DNATIVE_ENABLE_EXCEPTIONS=${{ matrix.exceptions }} -DNATIVE_ENABLE_PCH=ON -DNATIVE_ENABLE_IPO=ON \
            -DNATIVE_TEST_ISA="${{ matrix.platform.profile }}" \
            '-DNATIVE_PROFILES=${{ matrix.platform.profiles }}' "${extra[@]}"
      - name: Build
        id: build
        run: cmake --build build/core --parallel
      - name: Test
        id: test
        shell: bash
        run: |
          ctest --test-dir build/core --show-only=json-v1 > build/tests.json
          ctest --test-dir build/core --parallel --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/tests.xml"
      - name: Install
        run: cmake --install build/core --prefix build/install
      - name: Test relocated package boundaries and modules
        shell: bash
        run: |
          cmake -E rename build/install 'build/relocated package'
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then compiler=clang-cl; fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          # The installed archives from this test build contain profile counters.
          if [[ "$RUNNER_OS" != Windows && '${{ inputs.coverage }}' == true ]]; then
            extra+=(-DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate)
          fi
          cmake -S tests/package -B build/package -G Ninja \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -Dnative_DIR="$GITHUB_WORKSPACE/build/relocated package/lib/cmake/native" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF \
            "${extra[@]}"
          cmake --build build/package --parallel
          ctest --test-dir build/package --parallel --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/package-tests.xml"
      - name: Generate coverage report
        id: coverage
        if: always() && inputs.coverage && steps.build.outcome == 'success'
        run: |
          cmake --build build/core --target native_coverage
          jq -n --arg commit "$GITHUB_SHA" --arg runner '${{ matrix.platform.runner }}' \
            --arg arch "$RUNNER_ARCH" --arg isa '${{ matrix.platform.profile }}' \
            --arg profiles '${{ matrix.platform.profiles }}' \
            --arg suite '${{ (inputs.coverage || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'extended' || 'smoke' }}' \
            --arg result '${{ steps.test.outcome }}' --arg compiler "$(clang++ --version)" \
            '{commit: $commit, runner: $runner, architecture: $arch, test_isa: $isa,
              profiles: $profiles, suite: $suite, result: $result, compiler: $compiler}' \
            > build/core/coverage/report/configuration.json
          cp build/environment.log build/core/coverage/report/environment.log
      - name: Retain coverage report
        if: always() && inputs.coverage && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.platform.runner }}-${{ matrix.platform.profile }}
          retention-days: 7
          if-no-files-found: error
          path: build/core/coverage/report/
      - name: Upload coverage to Codecov
        if: always() && steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          use_oidc: true
          files: build/core/coverage/report/coverage.info
          disable_search: true
          flags: ${{ runner.os }}_${{ runner.arch }}_${{ (inputs.coverage || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'extended' || 'smoke' }}
          name: ${{ matrix.platform.runner }}-${{ matrix.platform.profile }}
          fail_ci_if_error: true
      - name: Record compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        shell: bash
        run: |
          mkdir -p build
          sccache --version | tee build/sccache-version.txt
          sccache --show-adv-stats | tee build/sccache-stats.txt
          sccache --show-stats --stats-format=json > build/sccache-stats.json
          {
            echo '### Compiler cache'
            echo '```text'
            cat build/sccache-version.txt build/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain configure, test and cache logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.platform.runner }}-${{ matrix.platform.profile }}-exceptions-${{ matrix.exceptions }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            build/environment.log
            build/sccache-*
            build/tests.json
            build/tests.xml
            build/package-tests.xml
            build/core/CMakeCache.txt
            build/core/CMakeFiles/CMakeConfigureLog.yaml
            build/core/Testing/Temporary/
            build/package/Testing/Temporary/
            build/package/compile_commands.json
            build/core/tests/**/*.log
            build/core/tests/**/*.disassembly
            build/core/tests/**/codegen.txt
            build/core/tests/**/paired-*.json
            build/core/tests/**/*-paired-*.txt
