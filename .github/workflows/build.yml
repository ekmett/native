name: native

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'etc/cmake/**'
      - 'src/**'
      - 'tests/**'
      - '!src/**/*.md'
      - '!tests/**/*.md'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'etc/cmake/**'
      - 'src/**'
      - 'tests/**'
      - '!src/**/*.md'
      - '!tests/**/*.md'
      - 'README.md'
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      coverage:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.coverage && github.run_id || github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.coverage }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          COVERAGE: ${{ inputs.coverage || false }}
        run: |
          python3 -B .github/scripts/test_ci_matrix.py
          python3 -B .github/scripts/ci_matrix.py

  build:
    needs: plan
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ (inputs.coverage || github.event_name == 'workflow_dispatch') && 90 || github.event_name == 'schedule' && 45 || 20 }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      NINJA_STATUS: "[%f/%t running=%r elapsed=%e] "
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "${BASE_SHA}^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - uses: ./.github/actions/setup/ubuntu/compiler
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/ubuntu/build-tools
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/macos/compiler
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/macos/build-tools
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/windows
        if: runner.os == 'Windows'
      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Set up module cache launcher
        uses: ekmett/modcache@main
      - name: Record Windows hardware and admit the test architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_PROFILE: ${{ matrix.profile }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & {
            git rev-parse HEAD
            Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, Architecture, NumberOfCores
            Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, OSArchitecture
            clang-cl --version
            clang-scan-deps --version
            cmake --version
            ninja --version
            "AVX2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported)"
            "FMA=$([System.Runtime.Intrinsics.X86.Fma]::IsSupported)"
            "BMI2=$([System.Runtime.Intrinsics.X86.Bmi2]::IsSupported)"
            "NEON=$([System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported)"
          } | Tee-Object build/environment.log
          if ($env:TEST_PROFILE -eq 'AVX2') {
            if ($env:RUNNER_ARCH -ne 'X64' -or
                -not [System.Runtime.Intrinsics.X86.Avx2]::IsSupported -or
                -not [System.Runtime.Intrinsics.X86.Fma]::IsSupported) {
              throw 'AVX2 tests require native x64 with AVX2 and FMA.'
            }
          } elseif ($env:RUNNER_ARCH -ne 'ARM64' -or
                    -not [System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported) {
            throw 'NEON tests require native ARM64 with Advanced SIMD.'
          }
          "Native Windows CPU tests: $env:RUNNER_ARCH / $env:TEST_PROFILE. AVX-512 execution depends on the test's CPU and OS checks." >> $env:GITHUB_STEP_SUMMARY
      - name: Record hardware and admit the test architecture
        if: runner.os != 'Windows'
        shell: bash
        env:
          TEST_PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p build
          {
            git rev-parse HEAD
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then
              lscpu
              cat /proc/cpuinfo
            else
              sysctl hw.model hw.machine hw.ncpu
              sysctl -a | grep -E '^machdep.cpu.|^hw.optional.' || true
            fi
            clang++ --version
            clang-scan-deps --version
            cmake --version
            ninja --version
          } | tee build/environment.log
          if [[ "$TEST_PROFILE" == NEON ]]; then
            case "$(uname -m)" in
              arm64|aarch64) ;;
              *) echo '::error::NEON tests require a native ARM64 runner.'; exit 1 ;;
            esac
          else
            [[ "$(uname -m)" == x86_64 ]] || {
              echo '::error::AVX2 tests require a native x86-64 runner.'; exit 1;
            }
            if [[ "$RUNNER_OS" == Linux ]]; then
              flags=$(cat /proc/cpuinfo)
            else
              flags=$(sysctl -n machdep.cpu.features machdep.cpu.leaf7_features)
            fi
            for feature in avx2 fma; do
              grep -qiw "$feature" <<< "$flags" || {
                echo "::error::This test profile requires $feature on the runner."
                exit 1
              }
            done
          fi
          echo "Native CPU package tests: $RUNNER_OS / $(uname -m) / $TEST_PROFILE. AVX-512 compilation is not proof of AVX-512 execution; profile tests report unsupported hardware as skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Install grcov
        if: inputs.coverage
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python .github/scripts/install_grcov.py
          else
            python3 .github/scripts/install_grcov.py
          fi
      - name: Configure modules
        shell: bash
        run: |
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=clang-cl
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          fi
          if [[ "${RUNNER_OS}" == Linux ]]; then
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          fi
          if [[ '${{ inputs.coverage }}' == true ]]; then
            extra+=(-DNATIVE_ENABLE_COVERAGE=ON)
          fi
          cmake -S . -B build/core -G Ninja \
            --profiling-format=google-trace --profiling-output=build/core-configure-trace.json \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=modcache \
            -DNATIVE_BUILD_TESTS=ON -DNATIVE_TEST_EXTENDED=${{ (inputs.coverage || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ON' || 'OFF' }} \
            -DNATIVE_TEST_SHARD=${{ matrix.shard }} -DNATIVE_TEST_SHARD_COUNT=${{ matrix.count == 1 && 6 || matrix.count }} \
            -DNATIVE_ENABLE_EXCEPTIONS=${{ matrix.exceptions }} -DNATIVE_ENABLE_PCH=ON -DNATIVE_ENABLE_IPO=ON \
            -DNATIVE_TEST_ISA="${{ matrix.profile }}" \
            '-DNATIVE_PROFILES=${{ matrix.profiles }}' "${extra[@]}"
      - name: Build
        id: build
        run: |
          build_status=0
          cmake --build build/core --parallel 4 || build_status=$?
          # Save this invocation before tests or coverage append another clock.
          if [[ -f build/core/.ninja_log ]]; then
            cp build/core/.ninja_log build/core/primary-build.ninja.log
          fi
          test "$build_status" -eq 0
      - name: Test
        id: test
        shell: bash
        run: |
          # Compile-failure checks belong to uninstrumented qualification.
          selection=()
          if [[ '${{ inputs.coverage }}' == true ]]; then selection+=(-LE negative); fi
          ctest --test-dir build/core "${selection[@]}" --show-only=json-v1 > build/tests.json
          ctest --test-dir build/core "${selection[@]}" --parallel 4 --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/tests.xml"
      - name: Install
        if: matrix.package
        run: cmake --install build/core --prefix build/install
      - name: Test relocated package boundaries and modules
        if: matrix.package
        shell: bash
        run: |
          cmake -E rename build/install 'build/relocated package'
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then compiler=clang-cl; fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          # The installed archives from this test build contain profile counters.
          if [[ "$RUNNER_OS" != Windows && '${{ inputs.coverage }}' == true ]]; then
            extra+=(-DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate)
          fi
          cmake -S tests/package -B build/package -G Ninja \
            --profiling-format=google-trace --profiling-output=build/package-configure-trace.json \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -Dnative_DIR="$GITHUB_WORKSPACE/build/relocated package/lib/cmake/native" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF \
            "${extra[@]}"
          build_status=0
          cmake --build build/package --parallel 4 || build_status=$?
          # Save this invocation before tests or coverage append another clock.
          if [[ -f build/package/.ninja_log ]]; then
            cp build/package/.ninja_log build/package/primary-build.ninja.log
          fi
          test "$build_status" -eq 0
          selection=()
          if [[ '${{ inputs.coverage }}' == true ]]; then selection+=(-LE negative); fi
          ctest --test-dir build/package "${selection[@]}" --parallel 4 --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/package-tests.xml"
      - name: Collect test reports
        id: test_reports
        if: ${{ !cancelled() }}
        run: |
          reports=()
          for report in build/tests.xml build/package-tests.xml; do
            if [[ -f "$report" ]]; then reports+=("$report"); fi
          done
          (IFS=,; echo "files=${reports[*]}") >> "$GITHUB_OUTPUT"
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.test_reports.outputs.files != '' }}
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          report_type: test_results
          use_oidc: true
          files: ${{ steps.test_reports.outputs.files }}
          disable_search: true
          flags: ${{ runner.os }}_${{ runner.arch }},${{ (inputs.coverage || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'extended' || 'smoke' }},exceptions_${{ matrix.exceptions }},${{ inputs.coverage && 'instrumented' || 'regular' }}
          name: ${{ matrix.key }}-${{ inputs.coverage && 'coverage' || 'build' }}
          fail_ci_if_error: true
      - name: Generate coverage report
        id: coverage
        if: always() && inputs.coverage && steps.build.outcome == 'success'
        run: |
          cmake --build build/core --target native_coverage
          jq -n --arg commit "$GITHUB_SHA" --arg runner '${{ matrix.runner }}' \
            --arg arch "$RUNNER_ARCH" --arg isa '${{ matrix.profile }}' \
            --arg profiles '${{ matrix.profiles }}' \
            --arg suite '${{ (inputs.coverage || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'extended' || 'smoke' }}' \
            --arg shard "${{ matrix.shard }}" --arg shard_count "${{ matrix.count }}" \
            --arg result '${{ steps.test.outcome }}' --arg compiler "$(clang++ --version)" \
            '{commit: $commit, runner: $runner, architecture: $arch, test_isa: $isa,
              profiles: $profiles, shard: $shard, shard_count: $shard_count, suite: $suite, result: $result, compiler: $compiler}' \
            > build/core/coverage/report/configuration.json
          cp build/environment.log build/core/coverage/report/environment.log
          if [[ "$RUNNER_OS" == Windows ]]; then
            python .github/scripts/coverage_flags.py
          else
            python3 .github/scripts/coverage_flags.py
          fi
          cat build/core/coverage/report/execution.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain coverage report
        if: always() && inputs.coverage && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.key }}-${{ steps.coverage.outputs.hardware }}
          retention-days: 7
          if-no-files-found: error
          path: build/core/coverage/report/
      - name: Upload coverage to Codecov
        if: always() && steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          use_oidc: true
          files: build/core/coverage/report/coverage.info
          disable_search: true
          flags: ${{ steps.coverage.outputs.flags }}
          name: ${{ matrix.key }}-${{ steps.coverage.outputs.hardware }}
          fail_ci_if_error: true
      - name: Record compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        shell: bash
        run: |
          mkdir -p build
          sccache --version | tee build/sccache-version.txt
          sccache --show-adv-stats | tee build/sccache-stats.txt
          sccache --show-stats --stats-format=json > build/sccache-stats.json
          {
            echo '### Compiler cache'
            echo '```text'
            cat build/sccache-version.txt build/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain configure, test and cache logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.key }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
          path: |
            build/environment.log
            build/sccache-*
            build/tests.json
            build/tests.xml
            build/package-tests.xml
            build/*-configure-trace.json
            build/core/primary-build.ninja.log
            build/core/CMakeFiles/rules.ninja
            build/core/build.ninja
            build/core/compile_commands.json
            build/package/primary-build.ninja.log
            build/package/CMakeFiles/rules.ninja
            build/package/build.ninja
            build/core/test-groups.txt
            build/core/CMakeCache.txt
            build/core/CMakeFiles/CMakeConfigureLog.yaml
            build/core/Testing/Temporary/
            build/package/Testing/Temporary/
            build/package/compile_commands.json
            build/core/tests/**/*.log
            build/core/tests/**/*.disassembly
            build/core/tests/**/codegen.txt
            build/core/tests/**/paired-*.json
            build/core/tests/**/*-paired-*.txt
      - name: Record successful shard
        env:
          SHARD_KEY: ${{ matrix.key }}
        run: |
          mkdir -p build/receipts
          jq -n --arg key "$SHARD_KEY" --arg commit "$GITHUB_SHA" \
            '{key: $key, commit: $commit}' > "build/receipts/$SHARD_KEY.json"
      - name: Retain successful shard receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-receipt-${{ matrix.key }}
          path: build/receipts/
          retention-days: 1
          if-no-files-found: error

  complete:
    name: Required platform shards
    if: always()
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and upload
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$PLAN_RESULT" = success && test "$BUILD_RESULT" = success
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-receipt-*
          path: receipts
          merge-multiple: true
      - name: Check complete platform inventory
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected = {p['key'] for p in json.loads(os.environ['MATRIX'])['include']}
          receipts = [json.loads(p.read_text()) for p in Path('receipts').glob('*.json')]
          actual = {r['key'] for r in receipts}
          assert actual == expected and len(receipts) == len(expected), (expected - actual, actual - expected)
          assert all(r['commit'] == os.environ['GITHUB_SHA'] for r in receipts)
          print(f"All {len(expected)} required shards built, tested and uploaded their reports.")
          PY
