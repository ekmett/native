name: C++26 modules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} / exceptions=${{ matrix.exceptions }}
    runs-on: ${{ matrix.platform.runner }}
    # Source and relocated consumers both rebuild the complete module graph.
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        exceptions: ['ON', 'OFF']
        platform:
          - name: Linux LLVM 23 / AVX2
            runner: ubuntu-24.04
            profile: AVX2
            profiles: AVX2;AVX512;AVX512_BF16;AVX512_FP16
          - name: Windows x64 LLVM 23 / AVX2
            runner: windows-2025
            profile: AVX2
            profiles: AVX2;AVX512;AVX512_BF16;AVX512_FP16
          - name: Windows ARM64 LLVM 23 / NEON
            runner: windows-11-arm
            profile: NEON
            profiles: NEON;NEON_FP16;NEON_BF16
          - name: Linux ARM64 LLVM 23 / NEON
            runner: ubuntu-24.04-arm
            profile: NEON
            profiles: NEON;NEON_FP16;NEON_BF16
          - name: macOS LLVM 23 / NEON
            runner: macos-15
            profile: NEON
            profiles: NEON;NEON_FP16;NEON_BF16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "${BASE_SHA}^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - uses: ./.github/actions/setup/ubuntu/compiler
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/ubuntu/build-tools
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/macos/compiler
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/macos/build-tools
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/windows
        if: runner.os == 'Windows'
      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Record Windows hardware and admit the test architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_PROFILE: ${{ matrix.platform.profile }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & {
            git rev-parse HEAD
            Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, Architecture, NumberOfCores
            Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, OSArchitecture
            clang-cl --version
            clang-scan-deps --version
            cmake --version
            ninja --version
            "AVX2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported)"
            "FMA=$([System.Runtime.Intrinsics.X86.Fma]::IsSupported)"
            "BMI2=$([System.Runtime.Intrinsics.X86.Bmi2]::IsSupported)"
            "NEON=$([System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported)"
          } | Tee-Object build/environment.log
          if ($env:TEST_PROFILE -eq 'AVX2') {
            if ($env:RUNNER_ARCH -ne 'X64' -or
                -not [System.Runtime.Intrinsics.X86.Avx2]::IsSupported -or
                -not [System.Runtime.Intrinsics.X86.Fma]::IsSupported) {
              throw 'AVX2 tests require native x64 with AVX2 and FMA.'
            }
          } elseif ($env:RUNNER_ARCH -ne 'ARM64' -or
                    -not [System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported) {
            throw 'NEON tests require native ARM64 with Advanced SIMD.'
          }
          "Native Windows CPU tests: $env:RUNNER_ARCH / $env:TEST_PROFILE. AVX-512 execution depends on the test's CPU and OS checks." >> $env:GITHUB_STEP_SUMMARY
      - name: Record hardware and admit the test architecture
        if: runner.os != 'Windows'
        shell: bash
        env:
          TEST_PROFILE: ${{ matrix.platform.profile }}
        run: |
          mkdir -p build
          {
            git rev-parse HEAD
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then
              lscpu
              cat /proc/cpuinfo
            else
              sysctl hw.model hw.machine hw.ncpu
              sysctl -a | grep -E '^machdep.cpu.|^hw.optional.' || true
            fi
            clang++ --version
            clang-scan-deps --version
            cmake --version
            ninja --version
          } | tee build/environment.log
          if [[ "$TEST_PROFILE" == NEON ]]; then
            case "$(uname -m)" in
              arm64|aarch64) ;;
              *) echo '::error::NEON tests require a native ARM64 runner.'; exit 1 ;;
            esac
          else
            [[ "$(uname -m)" == x86_64 ]] || {
              echo '::error::AVX2 tests require a native x86-64 runner.'; exit 1;
            }
            if [[ "$RUNNER_OS" == Linux ]]; then
              flags=$(cat /proc/cpuinfo)
            else
              flags=$(sysctl -n machdep.cpu.features machdep.cpu.leaf7_features)
            fi
            for feature in avx2 fma; do
              grep -qiw "$feature" <<< "$flags" || {
                echo "::error::This test profile requires $feature on the runner."
                exit 1
              }
            done
          fi
          echo "Native CPU package tests: $RUNNER_OS / $(uname -m) / $TEST_PROFILE. AVX-512 compilation is not proof of AVX-512 execution; profile tests report unsupported hardware as skipped." >> "$GITHUB_STEP_SUMMARY"
      - name: Check compiler cache launcher
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -B .github/scripts/test_sccache_launcher.py
          else
            python3 -B .github/scripts/test_sccache_launcher.py
          fi
      - name: Check PCH cache invalidation
        if: runner.os != 'Windows'
        run: |
          python3 -B .github/scripts/test_sccache_pch.py "$(command -v clang++)" "$GITHUB_WORKSPACE/build/sccache-pch-probe"
      - name: Check Windows module cache invalidation
        if: runner.os == 'Windows'
        run: |
          python -B .github/scripts/test_sccache_modules.py --compiler clang-cl \
            --output build/sccache-modules --cmake-arg=-DCMAKE_LINKER_TYPE=LLD
      - name: Configure modules
        shell: bash
        run: |
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=clang-cl
            launcher="python;$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          else
            launcher="$(command -v python3);$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"
          fi
          if [[ "${RUNNER_OS}" == Linux ]]; then
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          fi
          cmake -S . -B build/core -G Ninja \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" \
            -DNATIVE_BUILD_TESTS=ON -DNATIVE_ENABLE_EXCEPTIONS=${{ matrix.exceptions }} -DNATIVE_ENABLE_PCH=ON -DNATIVE_ENABLE_IPO=ON \
            -DNATIVE_TEST_ISA="${{ matrix.platform.profile }}" \
            '-DNATIVE_PROFILES=${{ matrix.platform.profiles }}' "${extra[@]}"
      - name: Build
        run: cmake --build build/core --parallel
      - name: Test
        shell: bash
        run: |
          ctest --test-dir build/core --show-only=json-v1 > build/tests.json
          ctest --test-dir build/core --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/tests.xml"
      - name: Retain native NEON compaction observations
        if: matrix.platform.profile == 'NEON'
        shell: bash
        run: |
          executable=build/core/tests/compaction/native_compaction_neon_import
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          "$executable" --bench | tee build/compaction-neon-benchmark.log
          object=$(find build/core/tests/compaction -type f -path '*native_compaction_neon_import_body.dir*' \( -name main.cc.o -o -name main.cc.obj \) -print -quit)
          test -n "$object"
          llvm-objdump -d --disassemble-symbols=compaction_codegen,expansion_codegen,compaction_store_codegen,_compaction_codegen,_expansion_codegen,_compaction_store_codegen "$object" > build/compaction-neon-codegen.log
          echo 'NEON compaction observations compare interleaved native and reference kernels on this hosted runner; these are not stable performance guarantees.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: cmake --install build/core --prefix build/install
      - name: Test relocated package boundaries and modules
        shell: bash
        run: |
          cmake -E rename build/install 'build/relocated package'
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then compiler=clang-cl; fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          suites=(public_headers omnibus api half_storage half_constexpr floating_instructions_constexpr float_constexpr instruction_storage source_targets native_cutover wasm_features)
          if [[ "${{ matrix.platform.profile }}" != NEON ]]; then
            suites+=(cpuid_package profile_package bf16_profile avx512_fp16 x86_crc32c x86_aes x86_gfni x86_vpopcntdq x86_avx512cd x86_bitalg x86_vbmi x86_pclmul x86_vnni x86_f16c x86_scalar_defaults x86_constexpr x86_integer_constexpr)
          else
            suites+=(neon_fp16 neon_bf16 arm_dotprod arm_rdm arm_fp16fml arm_fcma arm_i8mm arm_bf16 arm_crc arm_crypto arm_scalar_defaults arm_constexpr)
          fi
          for suite in "${suites[@]}"; do
            cmake -S "tests/$suite" -B "build/$suite" -G Ninja \
              -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -Dnative_DIR="$GITHUB_WORKSPACE/build/relocated package/lib/cmake/native" \
              -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF \
              "${extra[@]}"
            cmake --build "build/$suite" --parallel
            ctest --test-dir "build/$suite" --no-tests=error --output-on-failure \
              --output-junit "$GITHUB_WORKSPACE/build/$suite-tests.xml"
          done
      - name: Record compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        shell: bash
        run: |
          mkdir -p build
          sccache --version | tee build/sccache-version.txt
          sccache --show-adv-stats | tee build/sccache-stats.txt
          sccache --show-stats --stats-format=json > build/sccache-stats.json
          {
            echo '### Compiler cache'
            echo '```text'
            cat build/sccache-version.txt build/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain configure, test and cache logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.platform.runner }}-${{ matrix.platform.profile }}-exceptions-${{ matrix.exceptions }}
          if-no-files-found: ignore
          path: |
            build/environment.log
            build/compaction-neon-benchmark.log
            build/compaction-neon-codegen.log
            build/sccache-*
            build/tests.json
            build/tests.xml
            build/*-tests.xml
            build/public_headers/Testing/Temporary/
            build/omnibus/Testing/Temporary/
            build/cpuid_package/Testing/Temporary/
            build/cpuid_package/compile_commands.json
            build/core/tests/*/codegen.txt
            build/*/codegen.txt
            build/core/tests/source_targets/*.disassembly
            build/source_targets/*.disassembly
            build/core/tests/source_targets/reject-*.log
            build/core/tests/x86_gfni/*.disassembly
            build/core/tests/x86_gfni/*reject*.log
            build/x86_gfni/*.disassembly
            build/core/tests/x86_vpopcntdq/*.disassembly
            build/core/tests/x86_vpopcntdq/reject-*.log
            build/x86_vpopcntdq/*.disassembly
            build/core/tests/x86_vpopcntdq/*-paired-*.txt
            build/core/tests/x86_aes/*.disassembly
            build/core/tests/x86_aes/*-paired-*.txt
            build/core/tests/x86_aes/*-reject-*.log
            build/x86_aes/*.disassembly
            build/core/tests/x86_avx512cd/*.disassembly
            build/core/tests/x86_avx512cd/*-paired-*.txt
            build/core/tests/x86_avx512cd/reject-*.log
            build/x86_avx512cd/*.disassembly
            build/core/tests/x86_vbmi/*-paired-*.txt
            build/core/tests/x86_vbmi/*.disassembly
            build/core/tests/x86_vbmi/reject-*.log
            build/x86_vbmi/*.disassembly
            build/core/tests/x86_bitalg/*-paired-*.txt
            build/core/tests/x86_bitalg/*.disassembly
            build/core/tests/x86_bitalg/reject-*.log
            build/x86_bitalg/*.disassembly
            build/core/tests/x86_crc32c/*.disassembly
            build/core/tests/x86_crc32c/reject-*.log
            build/x86_crc32c/*.disassembly
            build/x86_crc32c/reject-*.log
            build/core/tests/arm_*/*codegen.txt
            build/core/tests/arm_*/*.disassembly
            build/core/tests/arm_*/negative-*.txt
            build/core/tests/arm_*/reject-*.log
            build/core/tests/arm_*/endian-*.s
            build/core/tests/arm_*/big-endian/
            build/source_targets/reject-*.log
            build/*/compile_commands.json
            build/*/Testing/Temporary/
            build/core/CMakeCache.txt
            build/core/CMakeFiles/CMakeConfigureLog.yaml
            build/core/Testing/Temporary/
