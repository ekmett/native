name: C++26 modules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux LLVM 23 / AVX2
            runner: ubuntu-24.04
            profile: AVX2
            profiles: AVX2;AVX512
          - name: macOS LLVM 23 / NEON
            runner: macos-15
            profile: NEON
            profiles: NEON
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "${BASE_SHA}^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - uses: ./.github/actions/setup/ubuntu/compiler
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/ubuntu/build-tools
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup/macos/compiler
        if: runner.os == 'macOS'
      - uses: ./.github/actions/setup/macos/build-tools
        if: runner.os == 'macOS'
      - name: Configure modules
        shell: bash
        run: |
          extra=()
          if [[ "${RUNNER_OS}" == Linux ]]; then
            extra+=(-DCMAKE_LINKER_TYPE=LLD)
          fi
          cmake -S . -B build/core -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DSIMD_BUILD_TESTS=ON -DSIMD_ENABLE_PCH=ON -DSIMD_ENABLE_IPO=ON \
            -DSIMD_TEST_ISA="${{ matrix.profile }}" \
            '-DSIMD_PROFILES=${{ matrix.profiles }}' "${extra[@]}"
      - name: Build
        run: cmake --build build/core --parallel 2
      - name: Test
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == Linux ]]; then
            for feature in avx2 fma bmi2; do
              grep -qw "${feature}" /proc/cpuinfo || {
                echo "::error::This test profile requires ${feature} on the runner."
                exit 1
              }
            done
          fi
          ctest --test-dir build/core --output-on-failure
      - name: Install
        run: cmake --install build/core --prefix build/install
      - name: Retain configure and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.profile }}
          if-no-files-found: ignore
          path: |
            build/core/CMakeCache.txt
            build/core/CMakeFiles/CMakeConfigureLog.yaml
            build/core/Testing/Temporary/
