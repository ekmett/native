name: Install module build tools
description: Install CMake and Ninja; configure checks the required versions.
runs:
  using: composite
  steps:
    - name: Install CMake and Ninja
      shell: bash
      run: |
        brew install cmake ninja
        echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"
        "$(brew --prefix)/bin/cmake" --version
        "$(brew --prefix)/bin/ninja" --version
