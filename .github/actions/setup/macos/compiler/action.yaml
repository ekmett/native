name: Install LLVM 23
description: Select Homebrew LLVM instead of the system Apple Clang driver.
runs:
  using: composite
  steps:
    - name: Install LLVM 23 tools
      shell: bash
      run: |
        brew install llvm@23
        llvm_prefix=$(brew --prefix llvm@23)
        echo "${llvm_prefix}/bin" >> "${GITHUB_PATH}"
        "${llvm_prefix}/bin/clang++" --version
        "${llvm_prefix}/bin/clang-scan-deps" --version
