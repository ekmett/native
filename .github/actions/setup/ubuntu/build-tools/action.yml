name: Install module build tools
description: Install CMake 4.4 and Ninja in an isolated Python environment.
runs:
  using: composite
  steps:
    - name: Install CMake and Ninja
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-venv
        python3 -m venv "${RUNNER_TEMP}/simd-build-tools"
        "${RUNNER_TEMP}/simd-build-tools/bin/python" -m pip install 'cmake>=4.4,<4.5' 'ninja>=1.12'
        echo "${RUNNER_TEMP}/simd-build-tools/bin" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/simd-build-tools/bin/cmake" --version
        "${RUNNER_TEMP}/simd-build-tools/bin/ninja" --version
