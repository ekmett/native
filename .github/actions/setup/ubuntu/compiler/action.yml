name: Install LLVM 23
description: Install the compiler, dependency scanner and linker from apt.llvm.org.
runs:
  using: composite
  steps:
    - name: Install LLVM 23 tools
      shell: bash
      run: |
        curl --fail --location https://apt.llvm.org/llvm.sh --output "${RUNNER_TEMP}/llvm.sh"
        sudo bash "${RUNNER_TEMP}/llvm.sh" 23
        sudo apt-get install -y clang-tools-23 lld-23
        echo /usr/lib/llvm-23/bin >> "${GITHUB_PATH}"
        /usr/lib/llvm-23/bin/clang++ --version
        /usr/lib/llvm-23/bin/clang-scan-deps --version
