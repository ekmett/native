coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# A platform that did not run has no coverage result for this commit.
flag_management:
  default_rules:
    carryforward: false

comment:
  layout: "reach,diff,flags,files"
  require_changes: true
